name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  relay:
    name: relay (typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seam/relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: seam/relay/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  engine:
    name: pine engine (offline compile · invariants)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seam/tests/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: seam/tests/engine/package-lock.json
      - run: npm ci
      - run: npm test

  brand:
    name: brand · wording check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node seam/tests/check-brand.mjs
